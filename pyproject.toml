[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "CPS5008 churn modelling pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "scikit-learn>=1.2,<2",
    "scipy>=1.10,<2",
    "joblib>=1.3,<2",
    "matplotlib>=3.7,<4",
]

[tool.setuptools.packages.find]
include = ["churn*"]
